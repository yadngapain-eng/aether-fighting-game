name: Build Godot Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Game (Linux, Web, Android)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP ANDROID SDK
      # ==========================================
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;23.2.8568313"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Setup Gradle
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_ENV

      # ==========================================
      # SETUP GODOT
      # ==========================================
      - name: Setup Godot
        uses: firebelley/godot-export@v5.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          relative_project_path: ./aether_game
          archive_output: true
          use_preset_export_path: true

      # ==========================================
      # DEBUG - CEK HASIL
      # ==========================================
      - name: Debug - Cek Hasil Build
        run: |
          echo "=== aether_game/builds/ ==="
          find aether_game/builds/ -type f 2>/dev/null || echo "Tidak ada"
          echo "=== Semua APK ==="
          find ~ -name "*.apk" -type f 2>/dev/null
          echo "=== Semua ZIP ==="
          find ~ -name "*.zip" -type f 2>/dev/null

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            aether_game/builds/linux/
            ~/.local/share/godot/builds/LinuxX11/
          if-no-files-found: warn

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            aether_game/builds/web/
            ~/.local/share/godot/builds/Web/
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            aether_game/builds/android/*.apk
            ~/.local/share/godot/builds/Android/
          if-no-files-found: warn

      # ==========================================
      # UPLOAD KE RELEASE (OPSIONAL)
      # ==========================================
      - name: Upload APK to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            aether_game/builds/android/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
