name: Build Godot Game (Linux, Web, Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Game

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== aether_game/ ==="
          ls -la aether_game/

      # ==========================================
      # SETUP JAVA
      # ==========================================
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ==========================================
      # SETUP ANDROID SDK MANUAL (TANPA android-actions/setup-android)
      # ==========================================
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          # Download cmdline-tools terbaru
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          
          # Set PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install packages yang dibutuhkan
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ || echo "Tidak ada folder"
          ls -la $ANDROID_HOME/ndk/ || echo "Tidak ada NDK"
          which sdkmanager || echo "sdkmanager tidak di PATH"
          java -version

      # ==========================================
      # SETUP GODOT
      # ==========================================
      - name: Setup Godot
        uses: firebelley/godot-export@v5.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          relative_project_path: ./aether_game
          archive_output: true
          use_preset_export_path: true

      # ==========================================
      # DEBUG - CEK HASIL
      # ==========================================
      - name: Debug - Cek Hasil Build
        run: |
          echo "=== aether_game/builds/ ==="
          find aether_game/builds/ -type f 2>/dev/null || echo "Tidak ada"
          echo "=== Cari APK ==="
          find ~ -name "*.apk" -type f 2>/dev/null
          echo "=== Cari ZIP ==="
          find ~ -name "*.zip" -type f 2>/dev/null
          echo "=== Cari .x86_64 ==="
          find ~ -name "*.x86_64" -type f 2>/dev/null

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            aether_game/builds/linux/
            ~/.local/share/godot/builds/LinuxX11/
          if-no-files-found: warn

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            aether_game/builds/web/
            ~/.local/share/godot/builds/Web/
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            aether_game/builds/android/
            ~/.local/share/godot/builds/Android/
          if-no-files-found: warn
