name: Build Godot Game (Linux, Web, Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Game

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ==========================================
      # SETUP ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      # ==========================================
      # GENERATE DEBUG KEYSTORE (UNTUK SIGNING APK)
      # ==========================================
      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          echo "✅ Debug keystore dibuat"
          ls -la ~/.android/

      # ==========================================
      # SETUP GODOT (DOWNLOAD DLL)
      # ==========================================
      - name: Download Godot
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          mv Godot_v4.2.1-stable_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p /tmp/godot_templates
          cd /tmp/godot_templates
          unzip -q /tmp/Godot_v4.2.1-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.2.1.stable/
          ls -la ~/.local/share/godot/export_templates/4.2.1.stable/
          # Verify version.txt
          cat ~/.local/share/godot/export_templates/4.2.1.stable/version.txt || echo "No version.txt"

      # ==========================================
      # INSTALL ANDROID BUILD TEMPLATE KE PROJECT
      # ==========================================
      - name: Install Android Build Template
        run: |
          cd aether_game
          
          # Extract android_source.zip ke folder android/ di project
          mkdir -p android
          cd android
          unzip -o -q ~/.local/share/godot/export_templates/4.2.1.stable/android_source.zip
          cd ..
          
          echo "✅ Android build template extracted"
          ls -la android/
          
          # Buat file .gdignore di folder android (opsional)
          touch android/.gdignore

      # ==========================================
      # IMPORT PROJECT & EXPORT
      # ==========================================
      - name: Import Project (First Time)
        run: |
          cd aether_game
          ~/godot/godot --headless --import --quit 2>&1 || true
          echo "✅ Project imported"

      - name: Export Linux
        run: |
          cd aether_game
          mkdir -p builds/linux
          ~/godot/godot --headless --export-release "Linux/X11" builds/linux/AetherFighting.x86_64 2>&1 || true
          echo "=== Linux build ==="
          ls -la builds/linux/ || echo "Tidak ada"

      - name: Export Web
        run: |
          cd aether_game
          mkdir -p builds/web
          ~/godot/godot --headless --export-release "Web" builds/web/index.html 2>&1 || true
          echo "=== Web build ==="
          ls -la builds/web/ || echo "Tidak ada"

      - name: Export Android APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          cd aether_game
          mkdir -p builds/android
          echo "=== DEBUG: Cek keystore ==="
          ls -la ~/.android/debug.keystore || echo "❌ Keystore tidak ada!"
          
          echo "=== DEBUG: Cek android template ==="
          ls -la android/ | head -20
          
          echo "=== Menjalankan export Android ==="
          ~/godot/godot --headless --verbose --export-debug "Android" builds/android/AetherFighting.apk 2>&1 || true
          
          echo "=== Hasil ==="
          ls -la builds/android/
          find . -name "*.apk" -type f

      - name: Debug - Cek Hasil Build
        run: |
          echo "=== aether_game/builds/ ==="
          find aether_game/builds/ -type f 2>/dev/null || echo "Tidak ada"
          echo "=== Cari APK ==="
          find . -name "*.apk" -type f 2>/dev/null

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: aether_game/builds/linux/
          if-no-files-found: warn

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: aether_game/builds/web/
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            aether_game/builds/android/*.apk
            aether_game/builds/android/
          if-no-files-found: warn
