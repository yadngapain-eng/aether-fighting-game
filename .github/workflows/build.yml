name: Build Godot Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Game

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========== JAVA ==========
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== ANDROID SDK ==========
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" > /dev/null 2>&1

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME/
          ls $ANDROID_HOME/ndk/
          which sdkmanager

      # ========== KEYSTORE ==========
      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          ls -la ~/.android/

      # ========== DOWNLOAD GODOT ==========
      - name: Download Godot
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          mv Godot_v4.2.1-stable_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p /tmp/godot_templates
          cd /tmp/godot_templates
          unzip -q /tmp/Godot_v4.2.1-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.2.1.stable/
          ls -la ~/.local/share/godot/export_templates/4.2.1.stable/

      # ========== IMPORT PROJECT ==========
      - name: Import Project
        run: |
          cd aether_game
          ~/godot/godot --headless --import --quit 2>&1 || true
          echo "✅ Project imported"

      # ========== EXPORT LINUX & WEB ==========
      - name: Export Linux
        run: |
          cd aether_game
          mkdir -p builds/linux
          ~/godot/godot --headless --export-release "Linux/X11" builds/linux/AetherFighting.x86_64 2>&1
          ls -la builds/linux/

      - name: Export Web
        run: |
          cd aether_game
          mkdir -p builds/web
          ~/godot/godot --headless --export-release "Web" builds/web/index.html 2>&1
          ls -la builds/web/

      # ========== ANDROID BUILD TEMPLATE ==========
      - name: Install Android Build Template
        run: |
          cd aether_game
          
          # Extract android_source.zip ke folder android/
          mkdir -p android
          cd android
          unzip -o -q ~/.local/share/godot/export_templates/4.2.1.stable/android_source.zip
          cd ..
          
          echo "=== Isi folder android/ ==="
          ls -la android/
          
          # Cek build.gradle harus ada
          if [ ! -f android/build.gradle ]; then
            echo "❌ build.gradle tidak ditemukan!"
            exit 1
          fi
          echo "✅ Android build template OK"

      # ========== EXPORT ANDROID (TANPA || true) ==========
      - name: Export Android APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          cd aether_game
          mkdir -p builds/android
          
          echo "=== Debug info ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la ~/.android/debug.keystore
          ls android/ | head -5
          
          echo "=== Exporting Android ==="
          ~/godot/godot --headless --verbose --export-debug "Android" builds/android/AetherFighting.apk
          
          echo "=== Hasil ==="
          ls -la builds/android/
          
          # Verifikasi APK ada dan > 1 MB
          APK_SIZE=$(stat -c%s builds/android/AetherFighting.apk 2>/dev/null || echo 0)
          echo "APK size: $APK_SIZE bytes"
          
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "❌ APK terlalu kecil atau tidak ada!"
            exit 1
          fi
          echo "✅ APK berhasil dibuat"

      # ========== UPLOAD ==========
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: aether_game/builds/linux/

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: aether_game/builds/web/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: aether_game/builds/android/*.apk
          if-no-files-found: error
